<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winxer</title>
<style>
:root{--bg:#3a1d7a}
*,*::before,*::after{box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:#fff;font:400 15px "Segoe UI","Selawik","Open Sans",sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:26px 48px 0;gap:24px}
.pivot{display:flex;gap:30px;align-items:baseline;margin:0}
.pivot button{background:none;border:0;color:#fff;opacity:.38;font:200 56px/1.2 "Segoe UI Light","Segoe UI","Selawik",sans-serif;cursor:pointer;letter-spacing:-1px;padding-top:6px}
.pivot button.on{opacity:1}
.pivot button:focus-visible{outline:2px solid #fff;outline-offset:4px}
main{flex:1;display:flex;gap:56px;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding:28px 48px 130px}
main::-webkit-scrollbar{height:8px;background:transparent}
main::-webkit-scrollbar-track{background:transparent}
main::-webkit-scrollbar-thumb{background:#fff5}
main::-webkit-scrollbar-thumb:hover{background:#fff8}
main::-webkit-scrollbar-corner{background:transparent}
main::-webkit-scrollbar-button:single-button{display:none}
main::-webkit-scrollbar-button{display:none;height:0;width:0;background:transparent}
.grp h2{font:300 22px "Segoe UI Light","Segoe UI",sans-serif;margin-bottom:14px;opacity:.85;position:sticky;left:0;z-index:5;pointer-events:auto;width:max-content;max-width:60vw;padding:4px 12px 4px 0;background:var(--bg)}
/* Цепочка: заголовки не закреплены — сжимаются и уезжают вместе с плитками. */
main.chainview .grp h2{position:static;background:none;padding:4px 0}
.row{display:flex;gap:8px}
.lib{display:grid;grid-template-rows:repeat(3,150px);grid-auto-flow:column dense;grid-auto-columns:150px;gap:8px;position:relative}
.lib .tile.tall{height:calc(var(--s)*2 + 8px)}
.lib .tile.wide{width:calc(var(--s)*2 + 8px)}
.tile.tall{grid-row:span 2;height:calc(var(--s)*2 + 8px)}
.tile.wide{grid-column:span 2;width:calc(var(--s)*2 + 8px)}
.tile.edit{transform:scale(.94);box-shadow:inset 0 0 0 3px #fff}
.rz{position:absolute;right:8px;bottom:8px;width:34px;height:34px;background:#1d1d1d;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;color:#fff;z-index:3}
.rz svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:square;display:block}
.rz:hover{background:#fff;color:#1d1d1d}
.rz:focus-visible{outline:2px solid #fff;outline-offset:3px}
.tile{--s:210px;position:relative;width:var(--s);height:var(--s);background:var(--c);padding:46px 14px 12px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;flex:none;overflow:hidden;transition:transform .12s ease-out,opacity .2s;animation:in .42s cubic-bezier(.1,.9,.2,1) both;animation-delay:var(--d,0ms);transform-origin:center;will-change:scale,opacity,transform}
.lib .tile{--s:150px}
@keyframes in{from{opacity:0;transform:translateX(90px) rotateY(-35deg)}to{opacity:1;transform:none}}
.tile{animation-fill-mode:backwards}
.tile b{font:600 19px/1.15 "Segoe UI Semibold","Segoe UI",sans-serif;overflow-wrap:break-word;word-break:normal;hyphens:none;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:0}
.tile b wbr{display:inline}
.tile small{font-size:13px;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .tile small{font-size:11px}
.lib .tile small.x86{font-size:11px;opacity:.95;font-weight:600;color:#ffd640;margin-top:4px}
.tile .idx{position:absolute;left:12px;top:4px;font:200 54px "Segoe UI Light","Segoe UI",sans-serif;opacity:.9}
.tile .fmt{position:absolute;top:8px;right:8px;font-size:12px;font-weight:600;background:#0003;padding:1px 6px;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.tile.dev{background:#0a0a0a;border:0;box-shadow:inset 0 0 0 3px var(--c)}
.tile.dev .big{position:absolute;left:12px;top:6px;font:200 44px "Segoe UI Light","Segoe UI",sans-serif}
.tile.off{background:#5b5b66}
.tile.off .idx,.tile.off b{opacity:.55}
.tile.off::after{content:"выкл";position:absolute;right:12px;bottom:12px;font-size:13px;opacity:.9}
.tile.sel{box-shadow:inset 0 0 0 5px #fff}
.tile.sel::before{content:"";position:absolute;right:0;top:0;border-style:solid;border-width:0 44px 44px 0;border-color:transparent #fff transparent transparent}
.tile.sel .chk{display:block}
.chk{display:none;position:absolute;right:5px;top:-1px;color:var(--c);font-weight:700;font-size:17px;z-index:2}
.tile.add{background:transparent;box-shadow:inset 0 0 0 3px #fff;align-items:center;justify-content:center;padding:0}
.tile.add span{font:200 96px/1 "Segoe UI Light","Segoe UI",sans-serif;display:block;transform:translateY(-14px)}
.tile.in{box-shadow:inset 0 0 0 3px #fff9}
.tile.in::before{content:"✓";position:absolute;top:8px;left:8px;font-weight:700;font-size:15px}
.tile.in::after{content:none}
.tile.dir{--s:auto;width:340px;min-height:90px;justify-content:center}
.hint{opacity:.7;font-size:14px;max-width:420px;margin-top:12px;line-height:1.35}
.hint.warn{opacity:.9;color:#ffb900;font-weight:600}
.rescan{background:none;border:0;color:#fff;opacity:.7;font:13px "Segoe UI",sans-serif;cursor:pointer;text-decoration:underline;margin-left:14px}
.bar{position:fixed;left:0;right:0;bottom:0;height:104px;background:#1d1d1d;display:flex;justify-content:center;align-items:flex-start;gap:26px;padding-top:14px;transform:translateY(100%);transition:transform .22s cubic-bezier(.1,.9,.2,1)}
.bar.up{transform:none}
.bar button{background:none;border:0;color:#fff;font:13px "Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:64px}
.bar i{width:46px;height:46px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font:normal 300 26px/1 "Segoe UI",sans-serif}
.bar button:hover i,.bar button:focus-visible i{background:#fff;color:#1d1d1d}
.bar button:active i{background:#fffc}
.bar button[disabled]{opacity:.3;pointer-events:none}
.msg{position:fixed;left:48px;bottom:130px;background:#1d1d1d;color:#fff;font:13px/1.4 "Segoe UI",sans-serif;padding:10px 14px;max-width:420px;display:none;white-space:pre-wrap}
.msg.show{display:block}
#pw{--c:#00a300;display:inline-grid;grid-template-columns:22px auto;align-items:center;column-gap:10px;width:136px;height:44px;padding:0 16px;background:transparent;color:#fff;border:2px solid #fff;border-radius:0;font:600 15px/1 "Segoe UI Semibold","Segoe UI",sans-serif;cursor:pointer;transition:background .12s,border-color .12s,transform .08s;margin:0 24px 14px 0;flex:none}
#pw svg{width:22px;height:22px;fill:currentColor;display:block}
#pw .stop{display:none}
#pw:hover{background:#ffffff26}
#pw:active{transform:scale(.96)}
#pw:focus-visible{outline:2px solid #fff;outline-offset:3px}
#pw.on{background:var(--c);border-color:var(--c)}
#pw.on:hover{background:#00b800;border-color:#00b800}
#pw.on .play{display:none}
#pw.on .stop{display:block}
@media(max-width:640px){.pivot button{font-size:38px}.pivot{gap:18px}.top{padding:18px 20px 0}main{padding:20px}.bar{gap:6px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top">
<nav class="pivot" id="pivot"></nav>
<button id="pw" aria-pressed="false">
  <svg class="play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z"/></svg>
  <svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14"/></svg>
  <span id="pwl">пуск</span>
</button>
</div>
<main id="main"></main>
<div class="msg" id="msg"></div>
<div class="bar" id="bar">
  <button data-a="gui"><i>▢</i>окно</button>
  <button data-a="off"><i>⏻</i>вкл/выкл</button>
  <button data-a="left"><i>‹</i>раньше</button>
  <button data-a="right"><i>›</i>позже</button>
  <button data-a="del"><i>×</i>убрать</button>
</div>
<script type="module" src="/main.js"></script>
</body>
</html>
