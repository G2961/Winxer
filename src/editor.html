<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Winxer</title>
<style>
:root{--c:#9f00a7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--c);color:#fff;font:400 15px "Segoe UI","Selawik",sans-serif;display:flex;flex-direction:column;user-select:none}
header{padding:22px 24px 14px}
header h1{font:300 34px "Segoe UI Light","Segoe UI",sans-serif;letter-spacing:-1px}
header small{opacity:.75;font-size:13px;display:block;margin-top:4px}
pre{background:#00000055;margin:0 24px;padding:14px;font:400 13px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-all;border:1px solid #ffffff22}
footer{margin-top:auto;padding:14px 24px 20px;display:flex;gap:10px;align-items:center}
footer button{background:#00000033;border:2px solid #fff;color:#fff;font:600 13px "Segoe UI",sans-serif;padding:8px 18px;cursor:pointer}
footer button:hover{background:#fff;color:var(--c)}
.presets{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px 0}
.presets button{background:#00000033;border:1px solid #ffffff66;color:#fff;font:13px "Segoe UI",sans-serif;padding:4px 10px;cursor:pointer}
.presets button:hover{border-color:#fff;background:#00000055}
</style>
</head>
<body>
<header><h1 id="t">Плагин</h1><small id="p"></small></header>
<div class="presets" id="presets"></div>
<pre id="info">загрузка…</pre>
<footer><button id="close">закрыть</button></footer>
<script type="module" src="/editor.js"></script>
</body>
</html>
